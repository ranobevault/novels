<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading — RanobeVault</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.10.6/sweetalert2.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.10.6/sweetalert2.all.min.js"></script>
<style>
  :root {
    --bg: #0d0d12; --bg2: #13131c;
    --surface: #1e1e2e; --border: #2e2e45;
    --accent: #c8a96e; --accent2: #e8c98e;
    --text: #e8e6f0; --text2: #a09dbb; --text3: #6b6884;
    --red: #e05c6a; --green: #5ce0a0;
    --reader-bg: #0f0f16;
    --reader-text: #d8d4e8;
    --font-size: 1.05rem;
    --line-height: 1.85;
    --radius: 10px;
  }
  .light-mode {
    --reader-bg: #faf8f2;
    --reader-text: #2a2520;
    --bg: #f5f3ed; --bg2: #ede9df;
    --surface: #fff; --border: #d4cfc2;
    --text: #2a2520; --text2: #6b6258; --text3: #a09888;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* TOP BAR */
  .top-bar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,13,18,0.92); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 16px; display: flex; align-items: center; gap: 10px; height: 52px;
    transition: background 0.3s;
  }
  .light-mode .top-bar { background: rgba(245,243,237,0.95); }
  .back-btn {
    background: none; border: none; color: var(--text2);
    cursor: pointer; padding: 6px; border-radius: 6px;
    display: flex; align-items: center; transition: color 0.2s;
    text-decoration: none;
  }
  .back-btn:hover { color: var(--accent); }
  .chapter-nav-title {
    flex: 1; min-width: 0;
    font-size: 0.8rem; color: var(--text3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .top-actions { display: flex; gap: 4px; }
  .top-btn {
    background: none; border: none;
    color: var(--text2); cursor: pointer;
    padding: 7px; border-radius: 6px; transition: all 0.2s;
    font-size: 0.85rem; display: flex; align-items: center;
  }
  .top-btn:hover { color: var(--accent); background: rgba(200,169,110,0.1); }

  /* SETTINGS PANEL */
  .settings-panel {
    position: fixed; top: 52px; right: 0; z-index: 99;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0 0 0 var(--radius);
    padding: 16px; width: 220px;
    box-shadow: -4px 4px 24px rgba(0,0,0,0.5);
    display: none;
  }
  .settings-panel.open { display: block; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .settings-label { font-size: 0.82rem; color: var(--text2); }
  .font-controls { display: flex; gap: 6px; align-items: center; }
  .font-btn {
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; width: 28px; height: 28px;
    cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .font-btn:hover { border-color: var(--accent); color: var(--accent); }
  .font-size-val { font-size: 0.8rem; color: var(--text2); min-width: 28px; text-align: center; }
  .mode-toggle {
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 4px 12px;
    cursor: pointer; font-size: 0.8rem; transition: all 0.2s; font-family: 'Lato', sans-serif;
  }
  .mode-toggle:hover { border-color: var(--accent); color: var(--accent); }

  /* PROGRESS BAR */
  .progress-bar {
    position: fixed; top: 52px; left: 0; right: 0; z-index: 98;
    height: 2px; background: var(--border);
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    width: 0%; transition: width 0.3s;
  }

  /* PAGINATION */
  .page-view { animation: pageFadeIn 0.22s ease; }
  @keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .page-nav {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 32px;
    border-top: 1px solid var(--border); padding-top: 20px;
  }
  .page-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text2); border-radius: var(--radius);
    padding: 10px 20px; cursor: pointer;
    font-family: 'Lato', sans-serif; font-size: 0.82rem;
    transition: all 0.2s; min-width: 90px;
  }
  .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .page-btn:disabled { opacity: 0.28; cursor: default; }
  .page-counter {
    font-size: 0.78rem; color: var(--text3);
    letter-spacing: 0.1em; text-align: center; white-space: nowrap;
  }
  .page-counter strong { color: var(--accent); font-size: 0.95rem; }

  /* EBOOK READER LAYOUT */
  body {
    background: var(--reader-bg); color: var(--reader-text);
    font-family: 'Lato', sans-serif;
    height: 100vh; overflow: hidden; /* no body scroll */
    transition: background 0.3s, color 0.3s;
  }

  /* Reading area fills exactly the space below the top bar */
  #content {
    position: fixed;
    top: 54px; /* top-bar height + progress bar */
    left: 0; right: 0;
    bottom: 0;
    overflow: hidden;
  }

  /* The page wrapper fills the content area */
  .chapter-wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
  }

  /* Tap zones — invisible left/right overlays for page turning */
  .tap-zone { display: none; } /* replaced by touch handler on page-view */

  /* The visible page content area — no scroll, fits viewport exactly */
  .page-view {
    flex: 1;
    overflow: hidden;
    padding: 20px 24px 8px;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
    animation: pageFadeIn 0.18s ease;
    min-height: 0;
    box-sizing: border-box;
  }
  @keyframes pageFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Top page header bar */
  .page-header {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 5px 16px;
    border-bottom: 1px solid var(--border);
    max-width: 680px; width: 100%; margin: 0 auto;
  }
  /* Pip dot row */
  .page-pip-counter {
    display: flex; align-items: center; gap: 5px;
    flex: 1; flex-wrap: wrap;
  }
  .pip {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--border); flex-shrink: 0;
    transition: background 0.2s, transform 0.2s;
  }
  .pip-active { background: var(--accent); transform: scale(1.5); }
  .pip-ellipsis { opacity: 0.4; }
  /* Minimal page number on right */
  .page-label {
    font-size: 0.68rem; color: var(--text3);
    white-space: nowrap; flex-shrink: 0;
    letter-spacing: 0.05em;
  }

  /* Bottom bar: page counter pinned to bottom */
  .page-footer {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 16px; padding: 10px 24px;
    border-top: 1px solid var(--border);
    max-width: 680px; width: 100%; margin: 0 auto;
  }
  .page-counter {
    font-size: 0.75rem; color: var(--text3);
    letter-spacing: 0.1em; text-align: center;
  }
  .page-counter strong { color: var(--accent); font-size: 0.85rem; }

  /* Hide old nav buttons — tap zones replace them */
  .page-nav { display: none; }

  /* CHAPTER HEADER (page 1 only) */
  .chapter-header { margin-bottom: 20px; text-align: center; }
  .chapter-series {
    font-size: 0.72rem; color: var(--text3);
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .chapter-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1rem, 3.5vw, 1.4rem);
    color: var(--accent); line-height: 1.3;
    margin-bottom: 14px;
  }
  .chapter-divider {
    display: flex; align-items: center; gap: 12px; color: var(--text3);
    margin-bottom: 20px;
  }
  .chapter-divider::before, .chapter-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }
  .chapter-divider span { font-size: 0.7rem; letter-spacing: 0.15em; }

  .chapter-illustration {
    margin: 1em 0; text-align: center;
  }
  .chapter-illustration img {
    max-width: 100%; max-height: 40vh;
    object-fit: contain; border-radius: 4px;
    display: block; margin: 0 auto;
  }

  .chapter-body p {
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: var(--reader-text);
    margin-bottom: 1.1em;
    text-align: justify;
    transition: font-size 0.2s, color 0.3s;
  }
  .page-1 .chapter-body p:first-child::first-letter {
    font-size: 3em; line-height: 0.8;
    float: left; margin: 0.05em 0.1em 0 0;
    color: var(--accent); font-family: 'Cinzel', serif;
  }
  .chapter-body code {
    font-family: 'Courier New', monospace;
    background: rgba(200,169,110,0.1); color: var(--accent);
    padding: 2px 6px; border-radius: 4px; font-size: 0.85em;
  }
  .chapter-body pre {
    background: #0a0a10; border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; margin: 0 0 1.1em;
    overflow-x: auto; font-family: 'Courier New', monospace;
    font-size: 0.82em; color: #a0c8a0; line-height: 1.5;
  }
  .light-mode .chapter-body pre { background: #f0ede6; color: #2a5a2a; }

  /* Last-page chapter nav */
  .chapter-nav {
    display: flex; gap: 10px;
    margin-top: 16px; padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .nav-chapter-btn {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius);
    padding: 12px 10px; cursor: pointer; text-align: center;
    text-decoration: none; transition: all 0.2s;
    font-family: 'Lato', sans-serif; display: block;
  }
  .nav-chapter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-chapter-btn.disabled { opacity: 0.35; pointer-events: none; }
  .nav-label { font-size: 0.68rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 3px; }
  .nav-ch-title { font-size: 0.82rem; font-weight: 700; }
  ._jnk {
    display: none !important;
    font-size: 0 !important;
    line-height: 0 !important;
    width: 0 !important;
    height: 0 !important;
    overflow: hidden !important;
    pointer-events: none !important;
    speak: none !important;
  }

  /* ANTI-COPY */
  .chapter-body, .chapter-title, .chapter-wrap {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
  }
  /* Override SweetAlert2 to match RanobeVault theme */
  .swal2-popup.ranobe-alert {
    background: #1e1e2e !important;
    border: 1px solid #2e2e45 !important;
    border-radius: 14px !important;
    font-family: 'Lato', sans-serif !important;
  }
  .swal2-popup.ranobe-alert .swal2-title {
    color: #c8a96e !important;
    font-family: 'Cinzel', serif !important;
    font-size: 1.15rem !important;
  }
  .swal2-popup.ranobe-alert .swal2-html-container {
    color: #a09dbb !important;
    font-size: 0.88rem !important;
    line-height: 1.6 !important;
  }
  .swal2-popup.ranobe-alert .swal2-confirm {
    background: #c8a96e !important;
    color: #1a1410 !important;
    font-family: 'Lato', sans-serif !important;
    font-weight: 700 !important;
    border-radius: 8px !important;
    padding: 10px 28px !important;
    border: none !important;
    box-shadow: none !important;
  }
  .swal2-popup.ranobe-alert .swal2-confirm:focus {
    box-shadow: 0 0 0 3px rgba(200,169,110,0.3) !important;
  }
  .swal2-popup.ranobe-alert .swal2-icon.swal2-warning {
    border-color: #c8a96e !important;
    color: #c8a96e !important;
  }

  /* LOADING */
  .loading-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 60vh; gap: 16px;
  }
  .spinner {
    width: 32px; height: 32px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 0.85rem; color: var(--text3); }

  /* ERROR */
  .error-screen { text-align: center; padding: 60px 20px; color: var(--text3); }
  .error-screen h2 { color: var(--red); margin-bottom: 8px; font-family: 'Cinzel', serif; }

  /* ADWALL OVERLAY */
  .adwall-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(8,8,14,0.98); backdrop-filter: blur(12px);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px; text-align: center;
  }
  .adwall-overlay.show { display: flex; }
  .adwall-badge {
    background: rgba(92,224,160,0.15); border: 1px solid rgba(92,224,160,0.4);
    color: var(--green); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.18em;
    padding: 4px 14px; border-radius: 20px; margin-bottom: 16px;
  }
  .adwall-icon { font-size: 3rem; margin-bottom: 10px; }
  .adwall-title {
    font-family: 'Cinzel', serif; font-size: 1.5rem; color: var(--accent);
    margin-bottom: 10px; letter-spacing: 0.05em;
  }
  .adwall-sub { color: var(--text2); font-size: 0.88rem; margin-bottom: 26px; line-height: 1.7; max-width: 320px; }
  .adwall-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #1a1410; border: none;
    border-radius: var(--radius); padding: 15px 36px;
    font-size: 1rem; font-weight: 700; cursor: pointer;
    font-family: 'Lato', sans-serif; transition: all 0.2s;
    text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 24px rgba(200,169,110,0.3);
  }
  .adwall-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 32px rgba(200,169,110,0.45); }
  .adwall-btn-icon { font-size: 1.1rem; }
  .adwall-note { margin-top: 12px; font-size: 0.75rem; color: var(--text3); }
  .adwall-back { margin-top: 20px; font-size: 0.8rem; color: var(--text3); cursor: pointer; }
  .adwall-back:hover { color: var(--accent); }
  /* locked next btn styling */
  .nav-chapter-btn.locked-btn {
    border-color: rgba(200,169,110,0.3);
    background: rgba(200,169,110,0.05);
    cursor: pointer; opacity: 1 !important; pointer-events: all !important;
  }
  .nav-chapter-btn.locked-btn:hover { border-color: var(--accent); color: var(--accent); }
  .locked-tag {
    display: inline-block; font-size: 0.62rem; padding: 1px 7px;
    background: rgba(200,169,110,0.15); border: 1px solid rgba(200,169,110,0.3);
    border-radius: 10px; color: var(--accent); margin-left: 4px; vertical-align: middle;
  }
</style>
</head>
<body>

<!-- ADWALL OVERLAY -->
<div class="adwall-overlay" id="adwall">
  <div class="adwall-badge">FREE</div>
  <div class="adwall-icon">🔓</div>
  <div class="adwall-title">Unlock This Chapter</div>
  <div class="adwall-sub">This chapter is free to read — just complete a quick link to unlock it.<br>No payment needed, ever.</div>
  <a class="adwall-btn" id="adwall-link" href="#" onclick="handleAdwallClick(event)">
    <span class="adwall-btn-icon">⚡</span> Unlock for Free
  </a>
  <div class="adwall-note">You only need to do this once per chapter.</div>
  <div class="adwall-back" onclick="history.back()">← Go Back</div>
</div>

<div class="top-bar">
  <a class="back-btn" id="back-link" href="index.html">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
  </a>
  <div class="chapter-nav-title" id="top-title">Loading...</div>
  <div class="top-actions">
    <button class="top-btn" id="settings-btn" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
    </button>
  </div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

<!-- SETTINGS PANEL -->
<div class="settings-panel" id="settings-panel">
  <div class="settings-row">
    <span class="settings-label">Font Size</span>
    <div class="font-controls">
      <button class="font-btn" id="font-dec">A−</button>
      <span class="font-size-val" id="font-val">17</span>
      <button class="font-btn" id="font-inc">A+</button>
    </div>
  </div>
  <div class="settings-row">
    <span class="settings-label">Theme</span>
    <button class="mode-toggle" id="mode-toggle">☀ Light</button>
  </div>
</div>

<div id="content">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Loading chapter...</div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const hash = params.get('h');
const unlockParam = params.get('unlock');

// If the URL contains ?unlock=, the user just came back from the ad — save the key
if (unlockParam) {
  localStorage.setItem(`rv_key_${unlockParam}`, '1');
  // Clean the URL so the key isn't visible or shareable
  const cleanUrl = `${location.pathname}?h=${hash}`;
  history.replaceState(null, '', cleanUrl);
}

let chapterData = null;
let hashmapData = null;
let currentEntry = null;
let fontSize = parseInt(localStorage.getItem('reader_fontsize') || '17');
let isLight = localStorage.getItem('reader_light') === '1';

if (!hash) { location.href = 'index.html'; }

// Apply saved settings immediately
applyFontSize();
applyMode();

function isUnlocked(entry) {
  if (!entry || !entry.locked) return true;
  if (!entry.unlockKey) return false;
  return localStorage.getItem(`rv_key_${entry.unlockKey}`) === '1';
}

async function init() {
  try {
    const hmRes = await fetch('data/hashmap.json');
    hashmapData = await hmRes.json();
    currentEntry = hashmapData[hash];

    if (!currentEntry) {
      showError('Chapter not found', 'This chapter link may be invalid or expired.');
      return;
    }



    // Gate: if chapter is locked and key not in localStorage, show adwall
    if (currentEntry.locked && !isUnlocked(currentEntry)) {
      showAdwall(hash);
      updateBackLink();
      return;
    }

    // Load chapter JSON
    const chRes = await fetch(`data/chapters/${currentEntry.file}`);
    if (!chRes.ok) throw new Error('Chapter file not found');
    chapterData = await chRes.json();

    // Preload next chapter
    if (currentEntry.next) {
      const nextEntry = hashmapData[currentEntry.next];
      if (nextEntry && !nextEntry.locked) {
        fetch(`data/chapters/${nextEntry.file}`).catch(() => {});
      }
    }

    renderChapter();
    updateBackLink();
    saveProgress();

  } catch(e) {
    showError('Failed to load chapter', e.message);
    console.error(e);
  }
}

// ── CSS Obfuscation helpers (module scope so renderPage can use them) ────────
const JUNK_POOL = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function randJunk(len) {
  let s = '';
  for (let i = 0; i < len; i++)
    s += JUNK_POOL[Math.floor(Math.random() * JUNK_POOL.length)];
  return s;
}
// ── Unicode poison pool ──────────────────────────────────────────────────────
// LAYER A — Invisible zero-width / directional / formatting chars
// These break tokenizers, search, copy-paste reconstruction.
const ZW_POISON = [
  '\u200B','\u200C','\u200D','\u200E','\u200F',
  '\u2060','\u2061','\u2062','\u2063','\u2064',
  '\uFEFF','\u00AD','\u034F',
  '\u115F','\u1160','\u17B4','\u17B5',
  '\u1D173','\u1D174','\u1D175','\u1D176', // musical invisible chars
  '\u{E0020}','\u{E007F}',                  // tag block invisibles
];

// LAYER B — Homoglyph map: swap common Latin letters for visually identical
// chars from Cyrillic, Greek, or other Unicode blocks.
// A cleanup script targeting invisible chars won't touch these at all —
// they look correct on screen but encode differently, breaking:
//   exact-match search, diff tools, AI tokenization, copy reconstruction.
const HOMOGLYPHS = {
  'a': '\u0430', // Cyrillic а
  'e': '\u0435', // Cyrillic е
  'o': '\u043E', // Cyrillic о
  'p': '\u0440', // Cyrillic р
  'c': '\u0441', // Cyrillic с
  'x': '\u0445', // Cyrillic х
  'A': '\u0410', // Cyrillic А
  'E': '\u0415', // Cyrillic Е
  'O': '\u041E', // Cyrillic О
  'P': '\u0420', // Cyrillic Р
  'C': '\u0421', // Cyrillic С
  'B': '\u0412', // Cyrillic В
  'H': '\u041D', // Cyrillic Н (looks like H)
  'K': '\u041A', // Cyrillic К
  'M': '\u041C', // Cyrillic М
  'T': '\u0422', // Cyrillic Т
  'i': '\u0456', // Ukrainian і (identical to i)
};
const HOMOGLYPH_CHARS = Object.keys(HOMOGLYPHS);

// Applies homoglyph swaps to ~15-30% of eligible chars in a word.
// Low rate keeps it subtle; random rate per word prevents patterns.
function applyHomoglyphs(word) {
  if (word.length < 2) return word;
  const rate = 0.15 + Math.random() * 0.15; // 15–30% of eligible chars
  return word.split('').map(ch => {
    if (HOMOGLYPHS[ch] && Math.random() < rate) return HOMOGLYPHS[ch];
    return ch;
  }).join('');
}

// Returns 1-3 random invisible poison chars, weighted toward 1.
function poisonChars() {
  const roll = Math.random();
  const count = roll < 0.55 ? 1 : roll < 0.85 ? 2 : 3;
  let result = '';
  const used = new Set();
  let attempts = 0;
  while (result.length < count && attempts < 20) {
    attempts++;
    const idx = Math.floor(Math.random() * ZW_POISON.length);
    if (!used.has(idx)) { used.add(idx); result += ZW_POISON[idx]; }
  }
  return result;
}

// Injects invisible chars at a random position within/around a word.
function poisonWord(word) {
  if (!word) return word;
  const r = Math.random();
  if (r < 0.25) {
    return poisonChars() + word;
  } else if (r < 0.50) {
    return word + poisonChars();
  } else if (r < 0.75) {
    const split = 1 + Math.floor(Math.random() * Math.max(1, word.length - 1));
    return word.slice(0, split) + poisonChars() + word.slice(split);
  } else {
    // Double injection: before + mid-split
    const split = 1 + Math.floor(Math.random() * Math.max(1, word.length - 1));
    return poisonChars() + word.slice(0, split) + poisonChars() + word.slice(split);
  }
}

function obfuscatePara(text) {
  const esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const words = esc.split(' ');
  return words.map((word, i) => {
    if (!word) return '';
    // Visible word is completely untouched — renders perfectly on screen.
    // All poison is stuffed inside display:none / zero-size spans.
    // Reader mode and scrapers extract the span content too, getting garbage.
    const style = i % 2 === 0
      ? `display:none`
      : `font-size:0;color:transparent;position:absolute`;
    // Span content: random ASCII + invisible Unicode + homoglyph-swapped junk
    const ascii = randJunk(4 + Math.floor(Math.random() * 5));
    const poison = poisonChars();
    const glyphed = applyHomoglyphs(randJunk(3 + Math.floor(Math.random() * 4)));
    return `${word}<span aria-hidden="true" style="${style}" class="_jnk">${poison}${ascii}${glyphed}</span>`;
  }).join(' ');
}
function processContent(paragraphs) {
  let html = '';
  let codeBuffer = [];
  let inCode = false;
  paragraphs.forEach(para => {
    if (para.startsWith('[img]')) {
      if (inCode) { html += `<pre>${codeBuffer.join('\n')}</pre>`; codeBuffer = []; inCode = false; }
      const url = para.slice(5).trim();
      html += `<figure class="chapter-illustration"><img src="${url}" alt="Illustration" loading="lazy" onerror="this.parentElement.style.display='none'"></figure>`;
      return;
    }
    const isCode = para.startsWith('>') || para.startsWith('spell ') || para.startsWith('//') || para.startsWith('NAME:') || para.startsWith('SYSTEM');
    if (isCode) {
      codeBuffer.push(para.replace(/</g,'&lt;').replace(/>/g,'&gt;'));
      inCode = true;
    } else {
      if (inCode) { html += `<pre>${codeBuffer.join('\n')}</pre>`; codeBuffer = []; inCode = false; }
      html += `<p>${obfuscatePara(para)}</p>`;
    }
  });
  if (codeBuffer.length) html += `<pre>${codeBuffer.join('\n')}</pre>`;
  return html;
}

// ── Pagination state ──────────────────────────────────────────────────────────
let allPages = [];
let currentPage = 0;

// Estimate paragraphs per page based on viewport height and font size
function calcParasPerPage() {
  const fontSize = parseInt(localStorage.getItem('fontSize') || '17');
  const lineHeight = 1.85;
  const paraSpacing = fontSize * 1.1; // margin-bottom ~1.1em
  const lineHeightPx = fontSize * lineHeight;
  const avgLinesPerPara = 3.5; // average paragraph height
  const paraHeightPx = (avgLinesPerPara * lineHeightPx) + paraSpacing;
  const topBarHeight = 54 + 2; // top bar + progress bar
  const footerHeight = 44; // page footer
  const headerHeight = 120; // chapter header on page 1 (only affects p1)
  const availableHeight = window.innerHeight - topBarHeight - footerHeight - 40; // 40px padding
  return Math.max(3, Math.floor(availableHeight / paraHeightPx));
}

function buildPages(paragraphs) {
  // Calculate available reading height in pixels:
  //   total viewport - top bar (54px) - page-header (~34px) - page-footer (~44px) - padding (28px)
  const topBar     = 54;
  const pageHeader = 34;
  const pageFooter = 44;
  const padding    = 28;
  const availH = window.innerHeight - topBar - pageHeader - pageFooter - padding;

  // Estimate how many characters fit per line based on viewport width and font size.
  // Font size is stored in `fontSize` (default 16px), line-height 1.85.
  const fs = typeof fontSize !== 'undefined' ? fontSize : 16;
  const lineH       = fs * 1.85;           // px per line
  const charsPerLine = Math.floor((Math.min(window.innerWidth, 680) - 48) / (fs * 0.52));
  const paraMargin  = fs * 1.4;            // margin-bottom between paragraphs

  // Estimate pixel height of a paragraph given its text length
  function paraHeight(text) {
    if (text.startsWith('[img]')) return Math.min(window.innerWidth * 0.75, 320); // illustration estimate
    const isCode = text.startsWith('>') || text.startsWith('//') ||
      text.startsWith('NAME:') || text.startsWith('SYSTEM') || text.startsWith('spell ');
    const lines = isCode
      ? text.split('\n').length
      : Math.ceil(text.length / charsPerLine) || 1;
    return (lines * lineH) + paraMargin;
  }

  const pages = [];
  let buf = [];
  let usedH = 0;

  paragraphs.forEach(para => {
    const h = paraHeight(para);
    const realParas = buf.filter(p =>
      !p.startsWith('>') && !p.startsWith('//') && !p.startsWith('NAME:') &&
      !p.startsWith('SYSTEM') && !p.startsWith('spell ') && !p.startsWith('[img]'));

    // If adding this paragraph would overflow AND we already have content, flush
    if (usedH + h > availH && realParas.length >= 1) {
      pages.push([...buf]);
      buf = [para];
      usedH = h;
    } else {
      buf.push(para);
      usedH += h;
    }
  });
  if (buf.length) pages.push(buf);
  return pages;
}

function renderPage(pageIndex) {
  currentPage = pageIndex;
  const pageData = allPages[pageIndex];
  const entry = currentEntry;
  const d = chapterData;
  const prevEntry = entry.prev ? hashmapData[entry.prev] : null;
  const nextEntry = entry.next ? hashmapData[entry.next] : null;
  const isLastPage = pageIndex === allPages.length - 1;
  const isFirstPage = pageIndex === 0;

  // Update progress bar
  const bar = document.getElementById('progress');
  if (bar) bar.style.width = allPages.length <= 1 ? '100%' : ((pageIndex / (allPages.length - 1)) * 100) + '%';

  // Save page position
  localStorage.setItem(`pos_${hash}`, pageIndex);

  // Build page body
  let bodyHtml = '';
  if (isFirstPage) {
    bodyHtml += `
      <div class="chapter-header">
        <div class="chapter-series" id="series-breadcrumb">Loading series...</div>
        <h1 class="chapter-title">${escHtml(d.title)}</h1>
        <div class="chapter-divider"><span>✦ ✦ ✦</span></div>
      </div>`;
  }
  bodyHtml += `<div class="chapter-body">${processContent(pageData)}</div>`;

  // Last page: show chapter nav inside the scrollable page view
  if (isLastPage) {
    bodyHtml += `
      <div class="chapter-nav">
        ${prevEntry
          ? `<a class="nav-chapter-btn" href="chapter.html?h=${entry.prev}">
              <div class="nav-label">◀ Previous</div>
              <div class="nav-ch-title">Ch. ${prevEntry.chapter}</div>
             </a>`
          : `<span class="nav-chapter-btn disabled"><div class="nav-label">◀ Previous</div><div class="nav-ch-title">First Chapter</div></span>`
        }
        <a class="nav-chapter-btn" href="series.html?id=${entry.series}" style="text-align:center">
          <div class="nav-label">≡</div>
          <div class="nav-ch-title">All Chapters</div>
        </a>
        ${nextEntry && (!nextEntry.locked || isUnlocked(nextEntry))
          ? `<a class="nav-chapter-btn" href="chapter.html?h=${entry.next}">
              <div class="nav-label">Next ▶</div>
              <div class="nav-ch-title">Ch. ${nextEntry.chapter}</div>
             </a>`
          : nextEntry && nextEntry.locked && !isUnlocked(nextEntry)
          ? `<span class="nav-chapter-btn locked-btn" onclick="showAdwall('${entry.next}')">
              <div class="nav-label">Next ▶</div>
              <div class="nav-ch-title">Ch. ${nextEntry.chapter} <span class="locked-tag">FREE</span></div>
             </span>`
          : `<span class="nav-chapter-btn disabled"><div class="nav-label">Next ▶</div><div class="nav-ch-title">Latest</div></span>`
        }
      </div>`;
  }

  const wrap = document.querySelector('.chapter-wrap');
  // Build pip dots — cap at 20, show condensed "..." beyond that
  const MAX_PIPS = 20;
  const total = allPages.length;
  let pipsHtml = '';
  if (total <= MAX_PIPS) {
    pipsHtml = Array.from({length: total}, (_, i) =>
      `<span class="pip${i === pageIndex ? ' pip-active' : ''}"></span>`
    ).join('');
  } else {
    // Show: first, ..., current-1, current, current+1, ..., last
    for (let i = 0; i < total; i++) {
      const near = Math.abs(i - pageIndex) <= 1 || i === 0 || i === total - 1;
      const edgeDot = (i === 1 && pageIndex > 2) || (i === total - 2 && pageIndex < total - 3);
      if (near) {
        pipsHtml += `<span class="pip${i === pageIndex ? ' pip-active' : ''}"></span>`;
      } else if (edgeDot) {
        pipsHtml += `<span class="pip pip-ellipsis"></span>`;
      }
    }
  }
  wrap.innerHTML = `
    <div class="page-header">
      <div class="page-pip-counter">${pipsHtml}</div>
      <div class="page-label">${pageIndex + 1} / ${total}</div>
    </div>
    <div class="page-view${isFirstPage ? ' page-1' : ''}">${bodyHtml}</div>
    <div class="page-footer">
      <div class="page-counter">Page <strong>${pageIndex + 1}</strong> / ${allPages.length}</div>
    </div>`;

  // Tap detection on page-view: short tap with minimal movement = page turn.
  // Left 30% = prev, right 30% = next. Center 40% = ignored (text selection area).
  // Scroll events are unaffected since we only act on touchend with no movement.
  const pv = wrap.querySelector('.page-view');
  if (pv) {
    let tapStartX = 0, tapStartY = 0, tapStartScroll = 0;
    pv.addEventListener('touchstart', e => {
      tapStartX = e.touches[0].clientX;
      tapStartY = e.touches[0].clientY;
      tapStartScroll = pv.scrollTop;
    }, { passive: true });
    pv.addEventListener('touchend', e => {
      const dx = Math.abs(e.changedTouches[0].clientX - tapStartX);
      const dy = Math.abs(e.changedTouches[0].clientY - tapStartY);
      const scrolled = Math.abs(pv.scrollTop - tapStartScroll);
      // Only act if it was a genuine tap: barely moved finger, no scroll happened
      if (dx < 12 && dy < 12 && scrolled < 8) {
        const xPct = tapStartX / window.innerWidth;
        if (xPct < 0.30 && currentPage > 0) renderPage(currentPage - 1);
        else if (xPct > 0.70 && currentPage < allPages.length - 1) renderPage(currentPage + 1);
      }
    }, { passive: true });
  }

  if (isFirstPage) {
    fetch('data/series.json').then(r=>r.json()).then(series => {
      const s = series.find(s => s.id === entry.series);
      const el = document.getElementById('series-breadcrumb');
      if (s && el) el.innerHTML = `<a href="series.html?id=${entry.series}" style="color:var(--text3);text-decoration:none">${s.title}</a>`;
    }).catch(()=>{});
  }

  applyFontSize();
}

function renderChapter() {
  const d = chapterData;
  const entry = currentEntry;
  const prevEntry = entry.prev ? hashmapData[entry.prev] : null;
  document.title = `${d.title} — RanobeVault`;
  document.getElementById('top-title').textContent = d.title;

  // Build pages and create shell
  allPages = buildPages(d.content || []);
  document.getElementById('content').innerHTML = `<div class="chapter-wrap"></div>`;

  setupProgress();

  // Restore saved page or start at 0
  const savedPage = parseInt(localStorage.getItem(`pos_${hash}`) || '0');
  renderPage((savedPage > 0 && savedPage < allPages.length) ? savedPage : 0);
}

function showAdwall(targetHash) {
  // If targetHash passed, we're unlocking the NEXT chapter from the nav button
  const unlockHash = targetHash || hash;
  const entry = targetHash ? hashmapData[targetHash] : currentEntry;

  // Already unlocked? Navigate directly
  if (isUnlocked(entry)) {
    window.location.href = `chapter.html?h=${unlockHash}`;
    return;
  }


  const overlay = document.getElementById('adwall');
  const link = document.getElementById('adwall-link');

  if (entry && entry.adwallUrl) {
    link.href = entry.adwallUrl;
    link.style.opacity = '1';
    link.style.pointerEvents = 'all';
  } else {
    link.href = '#';
    link.querySelector ? (link.querySelector('.adwall-btn-icon') || link).textContent : null;
    link.style.opacity = '0.5';
    link.style.pointerEvents = 'none';
  }

  overlay.classList.add('show');
}

function handleAdwallClick(e) {
  const link = document.getElementById('adwall-link');
  if (!link.href || link.href === '#' || link.href === window.location.href) {
    e.preventDefault(); return;
  }

  // Just navigate — unlock key is embedded in the Linkvertise destination URL (?unlock=...).
  // When user completes the ad and lands back on chapter.html, the key is read and saved automatically.
}

  // Check if user clicked "Don't show again" within the last 12 hours

    Swal.fire({
      background: '#1e1e2e',

      html: `
        <div style="font-size:0.88rem;color:#a09dbb;line-height:1.8;margin-top:4px">
          Bookmark or save this page so you can come back anytime without going through the link again.
          <br><br>
          <span style="font-size:0.8rem;color:#6b6884">

            💻 <strong style="color:#c8a96e">Desktop:</strong> Ctrl+D &nbsp;/&nbsp; Cmd+D (Mac)
          </span>

            <input type="checkbox" id="swal-dont-show" style="accent-color:#c8a96e;width:14px;height:14px;cursor:pointer">

          </label>

async function loadAndRenderChapter() {
  try {
    const chRes = await fetch(`data/chapters/${currentEntry.file}`);
    if (!chRes.ok) throw new Error('Chapter file not found');
    chapterData = await chRes.json();
    renderChapter();
    updateBackLink();
    saveProgress();
  } catch(e) {
    showError('Failed to load chapter', e.message);
  }
}

function updateBackLink() {
  if (currentEntry) {
    document.getElementById('back-link').href = `series.html?id=${currentEntry.series}`;
  }
}

function saveProgress() {
  if (!currentEntry || !chapterData) return;
  const data = { hash, title: chapterData.title, volume: currentEntry.volume, chapter: currentEntry.chapter };
  localStorage.setItem(`continue_${currentEntry.series}`, JSON.stringify(data));
  localStorage.setItem(`read_${hash}`, '1');
}

function setupProgress() {
  // Keyboard arrow navigation only — no scroll auto-advance
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      if (currentPage < allPages.length - 1) renderPage(currentPage + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      if (currentPage > 0) renderPage(currentPage - 1);
    }
  });
}

/* ============================================================
   ANTI-COPY SYSTEM — RanobeVault
   Covers: text selection (desktop mouseup), long-press (mobile),
   right-click, Ctrl/Cmd + C/A/U/S/P/X, F12, devtools shortcuts
   ============================================================ */
(function() {
  let alertShowing = false;
  let longPressTimer = null;
  const LONG_PRESS_MS = 500;

  function fireAlert(reason) {
    // Immediately nuke any selection
    if (window.getSelection) window.getSelection().removeAllRanges();
    if (document.selection) document.selection.empty();

    if (alertShowing) return;
    alertShowing = true;

    Swal.fire({
      customClass: { popup: 'ranobe-alert' },
      title: '✦ Content Protected ✦',
      html: `<span style="font-size:1.5rem;display:block;margin-bottom:8px">📖</span>
             This content is protected.<br>
             <span style="color:#c8a96e;font-size:0.82rem">${reason}</span>`,
      icon: 'warning',
      confirmButtonText: 'Understood',
      showClass: {
        popup: 'animate__animated animate__fadeInDown animate__faster'
      },
      hideClass: {
        popup: 'animate__animated animate__fadeOutUp animate__faster'
      },
      timer: 3500,
      timerProgressBar: true,
      allowOutsideClick: true,
      backdrop: 'rgba(10,10,16,0.7)',
      willClose: () => {
        alertShowing = false;
        if (window.getSelection) window.getSelection().removeAllRanges();
      }
    });
  }

  // ── 1. Text selection on desktop (mouseup) ──────────────────
  document.addEventListener('mouseup', function(e) {
    const sel = window.getSelection();
    if (sel && sel.toString().trim().length > 0) {
      // Only block if selection is inside chapter content
      const anchor = sel.anchorNode;
      if (anchor && document.querySelector('.chapter-body') &&
          document.querySelector('.chapter-body').contains(anchor)) {
        e.preventDefault();
        fireAlert('Please respect the author\'s work.');
      }
    }
  }, true);

  // Also clear selection on mousedown inside chapter body
  document.addEventListener('mousedown', function(e) {
    if (e.target.closest('.chapter-body') || e.target.closest('.chapter-wrap')) {
      setTimeout(() => {
        if (window.getSelection) window.getSelection().removeAllRanges();
      }, 0);
    }
  }, true);

  // ── 2. Long-press on mobile (touchend) ──────────────────────
  document.addEventListener('touchstart', function(e) {
    if (e.target.closest('.chapter-body') || e.target.closest('.chapter-wrap')) {
      longPressTimer = setTimeout(function() {
        if (window.getSelection) window.getSelection().removeAllRanges();
        fireAlert('Long press detected — content is protected.');
      }, LONG_PRESS_MS);
    }
  }, { passive: true });

  document.addEventListener('touchend', function() {
    clearTimeout(longPressTimer);
    const sel = window.getSelection();
    if (sel && sel.toString().trim().length > 0) {
      fireAlert('Text selection is disabled on this page.');
    }
  }, { passive: true });

  document.addEventListener('touchmove', function() {
    clearTimeout(longPressTimer);
  }, { passive: true });

  // ── 3. Right-click context menu ─────────────────────────────
  document.addEventListener('contextmenu', function(e) {
    if (e.target.closest('.chapter-body') || e.target.closest('.chapter-wrap') ||
        e.target.closest('.chapter-header')) {
      e.preventDefault();
      e.stopPropagation();
      fireAlert('Right-click is disabled on this page.');
      return false;
    }
  }, true);

  // ── 4. Keyboard shortcuts ────────────────────────────────────
  const BLOCKED_KEYS = new Set(['c', 'a', 'u', 's', 'p', 'x']);
  document.addEventListener('keydown', function(e) {
    const ctrl = e.ctrlKey || e.metaKey;

    // Block Ctrl/Cmd + C/A/U/S/P/X
    if (ctrl && BLOCKED_KEYS.has(e.key.toLowerCase())) {
      e.preventDefault();
      e.stopImmediatePropagation();
      const labels = { c:'Copy', a:'Select All', u:'View Source', s:'Save', p:'Print', x:'Cut' };
      fireAlert(`Keyboard shortcut (${e.key.toUpperCase()}) is disabled.`);
      return false;
    }

    // Block F12
    if (e.key === 'F12') {
      e.preventDefault();
      e.stopImmediatePropagation();
      fireAlert('Developer tools shortcut is disabled.');
      return false;
    }

    // Block Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C (devtools)
    if (ctrl && e.shiftKey && ['i','j','c','k'].includes(e.key.toLowerCase())) {
      e.preventDefault();
      e.stopImmediatePropagation();
      fireAlert('Developer tools are restricted on this page.');
      return false;
    }

    // Block Ctrl+Shift+U (Linux view source)
    if (ctrl && e.shiftKey && e.key.toLowerCase() === 'u') {
      e.preventDefault();
      e.stopImmediatePropagation();
      fireAlert('This action is disabled.');
      return false;
    }
  }, true);

  // ── 5. Copy / Cut events ─────────────────────────────────────
  document.addEventListener('copy', function(e) {
    e.preventDefault();
    e.stopImmediatePropagation();
    if (window.getSelection) window.getSelection().removeAllRanges();
    fireAlert('Copying is not allowed on this page.');
    return false;
  }, true);

  document.addEventListener('cut', function(e) {
    e.preventDefault();
    e.stopImmediatePropagation();
    fireAlert('Cutting is not allowed on this page.');
    return false;
  }, true);

  // ── 6. Drag selection ────────────────────────────────────────
  document.addEventListener('dragstart', function(e) {
    if (e.target.closest('.chapter-body')) {
      e.preventDefault();
      return false;
    }
  }, true);

  // ── 7. selectstart — prevent selection initiation ────────────
  document.addEventListener('selectstart', function(e) {
    if (e.target.closest('.chapter-body') || e.target.closest('.chapter-header')) {
      e.preventDefault();
      return false;
    }
  }, true);

  // ── 8. Devtools detection (size change heuristic) ────────────
  // NOTE: This uses window size difference as a heuristic. It can false-positive
  // on browsers with large toolbars, sidebars, or zoomed-out displays.
  // We use a generous threshold + a confirmation delay to avoid bothering readers.
  let devtoolsOpen = false;
  const threshold = 300; // raised to reduce false positives from browser UI chrome
  let devtoolsConfirmCount = 0; // require consistent detection before alerting

  setInterval(function() {
    const widthDiff  = window.outerWidth  - window.innerWidth;
    const heightDiff = window.outerHeight - window.innerHeight;
    const likelyOpen = widthDiff > threshold || heightDiff > threshold;

    if (likelyOpen && !devtoolsOpen) {
      devtoolsConfirmCount++;
      // Only trigger after 3 consecutive checks (~3s) to avoid brief resize false-fires
      if (devtoolsConfirmCount >= 3) {
        devtoolsOpen = true;
        devtoolsConfirmCount = 0;
        const body = document.querySelector('.chapter-body');
        if (body) body.style.filter = 'blur(6px)';

        // Show a friendly, non-accusatory notice
        if (alertShowing) return;
        alertShowing = true;
        Swal.fire({
          customClass: { popup: 'ranobe-alert' },
          title: '⚠ Just a heads-up!',
          html: `
            <span style="font-size:1.3rem;display:block;margin-bottom:10px">🛠️</span>
            <span style="color:#e8e6f0">It looks like your browser window is unusually narrow or a panel is open.</span>
            <br><br>
            <span style="color:#a09dbb;font-size:0.82rem">
              If you're just reading — no worries! This can also trigger from:<br>
              <span style="color:#c8a96e">• Browser sidebar or extensions panel</span><br>
              <span style="color:#c8a96e">• Zoomed-out display or small screen</span><br>
              <span style="color:#c8a96e">• Split-screen / windowed browsing</span><br><br>
              Simply close any side panels or go fullscreen and the content will restore.
            </span>`,
          icon: 'warning',
          confirmButtonText: '✓ Got it, close panels',
          showClass: { popup: 'animate__animated animate__fadeInDown animate__faster' },
          hideClass: { popup: 'animate__animated animate__fadeOutUp animate__faster' },
          allowOutsideClick: true,
          backdrop: 'rgba(10,10,16,0.7)',
          willClose: () => {
            alertShowing = false;
          }
        });
      }
    } else if (!likelyOpen) {
      devtoolsConfirmCount = 0;
      if (devtoolsOpen) {
        devtoolsOpen = false;
        const body = document.querySelector('.chapter-body');
        if (body) body.style.filter = '';
      }
    }
  }, 1000);

})();
</script>
</body>
</html>
