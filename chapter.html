<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --bg: #0d0d12; --bg2: #13131c;
    --surface: #1e1e2e; --border: #2e2e45;
    --accent: #c8a96e; --accent2: #e8c98e;
    --text: #e8e6f0; --text2: #a09dbb; --text3: #6b6884;
    --red: #e05c6a; --green: #5ce0a0;
    --reader-bg: #0f0f16;
    --reader-text: #d8d4e8;
    --font-size: 1.05rem;
    --line-height: 1.85;
    --radius: 10px;
  }
  .light-mode {
    --reader-bg: #faf8f2;
    --reader-text: #2a2520;
    --bg: #f5f3ed; --bg2: #ede9df;
    --surface: #fff; --border: #d4cfc2;
    --text: #2a2520; --text2: #6b6258; --text3: #a09888;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .top-bar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,13,18,0.92); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 16px; display: flex; align-items: center; gap: 10px; height: 52px;
    transition: background 0.3s;
  }
  .light-mode .top-bar { background: rgba(245,243,237,0.95); }
  .back-btn {
    background: none; border: none; color: var(--text2);
    cursor: pointer; padding: 6px; border-radius: 6px;
    display: flex; align-items: center; transition: color 0.2s;
    text-decoration: none;
  }
  .back-btn:hover { color: var(--accent); }
  .chapter-nav-title {
    flex: 1; min-width: 0;
    font-size: 0.8rem; color: var(--text3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .top-actions { display: flex; gap: 4px; }
  .top-btn {
    background: none; border: none;
    color: var(--text2); cursor: pointer;
    padding: 7px; border-radius: 6px; transition: all 0.2s;
    font-size: 0.85rem; display: flex; align-items: center;
  }
  .top-btn:hover { color: var(--accent); background: rgba(200,169,110,0.1); }

  .settings-panel {
    position: fixed; top: 52px; right: 0; z-index: 99;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0 0 0 var(--radius);
    padding: 16px; width: 220px;
    box-shadow: -4px 4px 24px rgba(0,0,0,0.5);
    display: none;
  }
  .settings-panel.open { display: block; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .settings-label { font-size: 0.82rem; color: var(--text2); }
  .font-controls { display: flex; gap: 6px; align-items: center; }
  .font-btn {
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; width: 28px; height: 28px;
    cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .font-btn:hover { border-color: var(--accent); color: var(--accent); }
  .font-size-val { font-size: 0.8rem; color: var(--text2); min-width: 28px; text-align: center; }
  .mode-toggle {
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 4px 12px;
    cursor: pointer; font-size: 0.8rem; transition: all 0.2s; font-family: 'Lato', sans-serif;
  }
  .mode-toggle:hover { border-color: var(--accent); color: var(--accent); }

  .progress-bar {
    position: fixed; top: 52px; left: 0; right: 0; z-index: 98;
    height: 2px; background: var(--border);
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    width: 0%; transition: width 0.3s;
  }

  .page-view { animation: pageFadeIn 0.22s ease; }
  @keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  body {
    background: var(--reader-bg); color: var(--reader-text);
    font-family: 'Lato', sans-serif;
    height: 100vh; overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }

  #content {
    position: fixed;
    top: 54px;
    left: 0; right: 0;
    bottom: 0;
    overflow: hidden;
  }

  .chapter-wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
  }

  .page-view {
    flex: 1;
    overflow: hidden;
    padding: 12px 22px 28px;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
    animation: pageFadeIn 0.18s ease;
    min-height: 0;
    box-sizing: border-box;

  .page-header {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 5px 16px;
    border-bottom: 1px solid var(--border);
    max-width: 680px; width: 100%; margin: 0 auto;
  }
  .page-pip-counter {
    display: flex; align-items: center; gap: 5px;
    flex: 1; flex-wrap: wrap;
  }
  .pip {
    width: 5px; height: 5px; border-radius: 50%;

  .pip-active { background: var(--accent); transform: scale(1.5); }

  .page-label {
    font-size: 0.68rem; color: var(--text3);

    letter-spacing: 0.05em;

  .page-footer {
    position: absolute;

  .page-counter {
    font-size: 0.68rem;

  .page-nav { display: none; }

  .chapter-header { margin-bottom: 20px; text-align: center; }
  .chapter-series {
    font-size: 0.72rem; color: var(--text3);
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .chapter-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1rem, 3.5vw, 1.4rem);
    color: var(--accent); line-height: 1.3;
    margin-bottom: 14px;
  }
  .chapter-divider {
    display: flex; align-items: center; gap: 12px; color: var(--text3);

  .chapter-divider::before, .chapter-divider::after {

  .chapter-illustration {

    padding: 0;
    text-align: center;

  .chapter-nav {

  .loading-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 60vh; gap: 16px;
  }
  .spinner {
    width: 32px; height: 32px; border: 2px solid var(--border);

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-screen { text-align: center; padding: 60px 20px; color: var(--text3); }

  .adwall-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(8,8,14,0.98); backdrop-filter: blur(12px);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px; text-align: center;
  }
  .adwall-overlay.show { display: flex; }
  .adwall-badge {
    background: rgba(92,224,160,0.15); border: 1px solid rgba(92,224,160,0.4);
    color: var(--green); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.18em;
    padding: 4px 14px; border-radius: 20px; margin-bottom: 16px;

  .adwall-icon { font-size: 3rem; margin-bottom: 10px; }
  .adwall-title {

  .adwall-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));

<script>
const params = new URLSearchParams(location.search);
const hash = params.get('h');
const unlockParam = params.get('unlock');

if (unlockParam) {
  localStorage.setItem(`rv_key_${unlockParam}`, '1');
  const cleanUrl = `${location.pathname}?h=${hash}`;
  history.replaceState(null, '', cleanUrl);
}

let chapterData = null;
let hashmapData = null;
let currentEntry = null;
let fontSize = parseInt(localStorage.getItem('reader_fontsize') || '17');
let isLight = localStorage.getItem('reader_light') === '1';

var CHAPTER_ENDPOINT = 'https://ranobevault-chapters.non-admin.workers.dev/chapter';
var HASHMAP_ENDPOINT = CHAPTER_ENDPOINT.replace(/\/chapter$/, '/hashmap');

async function fetchChapterFile(filename) {
  const res = await fetch(`${CHAPTER_ENDPOINT}?file=${encodeURIComponent(filename)}`);
  if (!res.ok) throw new Error('Chapter file not found');
  return res.json();
}

async function fetchHashmap() {
  const res = await fetch(HASHMAP_ENDPOINT);
  if (!res.ok) throw new Error('Hashmap not found');
  return res.json();
}

if (!hash) { location.href = 'index.html'; }

applyFontSize();
applyMode();

function isUnlocked(entry) {
  if (!entry || !entry.locked) return true;
  if (!entry.unlockKey) return false;
  return localStorage.getItem(`rv_key_${entry.unlockKey}`) === '1';
}

async function init() {
  try {
    hashmapData = await fetchHashmap();
    currentEntry = hashmapData[hash];

    if (!currentEntry) {
      showError('Chapter not found', 'This chapter link may be invalid or expired.');
      return;
    }

    if (currentEntry.locked && !isUnlocked(currentEntry)) {
      showAdwall(hash);
      updateBackLink();
      return;
    }

    chapterData = await fetchChapterFile(currentEntry.file);

    if (currentEntry.next) {
      const nextEntry = hashmapData[currentEntry.next];
      if (nextEntry && !nextEntry.locked) {
        fetchChapterFile(nextEntry.file).catch(() => {});
      }
    }

    renderChapter();
    updateBackLink();
    saveProgress();
    
    // ── AGGRESSIVE IMAGE PRELOADING ────────────────────────────────────
    // Load ALL images in chapter background after chapter renders
    setTimeout(() => preloadAllImages(), 200);

  } catch(e) {
    showError('Failed to load chapter', e.message);
    console.error(e);
  }
}

const JUNK_POOL = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function randJunk(len) {
  let s = '';
  for (let i = 0; i < len; i++)
    s += JUNK_POOL[Math.floor(Math.random() * JUNK_POOL.length)];
  return s;
}

const WATERMARK_RATE = 0.12;
const WATERMARKS = [
  'Read this officially at ranobevault.github.io',
  'Official source: RanobeVault — ranobevault.github.io',
  'Support the translator, read free at ranobevault.github.io',
  'This chapter is hosted at ranobevault.github.io',
];
function watermarkSpan() {
  const phrase = WATERMARKS[Math.floor(Math.random() * WATERMARKS.length)];
  return ` <span aria-hidden="true" style="position:absolute;left:-9999px;white-space:nowrap">${phrase}</span> `;
}

const ZW_POISON = [
  '\u200B','\u200C','\u200D','\u200E','\u200F',
  '\u2060','\u2061','\u2062','\u2063','\u2064',
  '\uFEFF','\u00AD','\u034F',
  '\u115F','\u1160','\u17B4','\u17B5',
];

const HOMOGLYPHS = {
  'a': '\u0430', 'e': '\u0435', 'o': '\u043E', 'p': '\u0440', 'c': '\u0441', 'x': '\u0445',
  'A': '\u0410', 'E': '\u0415', 'O': '\u041E', 'P': '\u0420', 'C': '\u0421', 'B': '\u0412',
  'H': '\u041D', 'K': '\u041A', 'M': '\u041C', 'T': '\u0422', 'i': '\u0456',
};

function applyHomoglyphs(word) {
  if (word.length < 2) return word;
  const rate = 0.15 + Math.random() * 0.15;
  return word.split('').map(ch => {
    if (HOMOGLYPHS[ch] && Math.random() < rate) return HOMOGLYPHS[ch];
    return ch;
  }).join('');
}

function poisonChars() {
  const roll = Math.random();
  const count = roll < 0.55 ? 1 : roll < 0.85 ? 2 : 3;
  let result = '';
  const used = new Set();
  let attempts = 0;
  while (result.length < count && attempts < 20) {
    attempts++;
    const idx = Math.floor(Math.random() * ZW_POISON.length);
    if (!used.has(idx)) { used.add(idx); result += ZW_POISON[idx]; }
  }
  return result;
}

function poisonWord(word) {
  if (!word) return word;
  const r = Math.random();
  if (r < 0.25) {
    return poisonChars() + word;
  } else if (r < 0.50) {
    return word + poisonChars();
  } else if (r < 0.75) {
    const split = 1 + Math.floor(Math.random() * Math.max(1, word.length - 1));
    return word.slice(0, split) + poisonChars() + word.slice(split);
  } else {
    const split = 1 + Math.floor(Math.random() * Math.max(1, word.length - 1));
    return poisonChars() + word.slice(0, split) + poisonChars() + word.slice(split);
  }
}

function scrambleWords(items) {
  const indexed = items.map((html, i) => ({ html, order: i }));
  for (let i = indexed.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
  }
  return indexed.map(({ html, order }) =>
    `<span class="_w" style="order:${order}">${html}</span>`
  ).join('');
}

function obfuscatePara(text, scramble) {
  const esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const words = esc.split(' ');
  const processedWords = words.map((word, i) => {
    if (!word) return '';
    const ascii = randJunk(4 + Math.floor(Math.random() * 5));
    const poison = poisonChars();
    const glyphed = applyHomoglyphs(randJunk(3 + Math.floor(Math.random() * 4)));
    return `${word}<span aria-hidden="true" class="_jnk">${poison}${ascii}${glyphed}</span>`;
  });

  if (processedWords.length > 3 && Math.random() < WATERMARK_RATE) {
    const idx = 1 + Math.floor(Math.random() * (processedWords.length - 1));
    processedWords.splice(idx, 0, watermarkSpan());
  }

  return scramble ? scrambleWords(processedWords) : processedWords.join(' ');
}

function processContent(paragraphs) {
  let html = '';
  let codeBuffer = [];
  let inCode = false;
  let paraCount = 0;
  paragraphs.forEach((para, idx) => {
    if (para.startsWith('[img]')) {
      if (inCode) { html += `<pre>${codeBuffer.join('\n')}</pre>`; codeBuffer = []; inCode = false; }
      const url = para.slice(5).trim();
      // All illustrations: consistent 80vh fullpage
      html += `<figure class="chapter-illustration"><img src="${url}" alt="Illustration" loading="lazy" onerror="this.parentElement.style.display='none'"></figure>`;
      return;
    }
    const isCode = para.startsWith('>') || para.startsWith('spell ') || para.startsWith('//') || para.startsWith('NAME:') || para.startsWith('SYSTEM');
    if (isCode) {
      codeBuffer.push(para.replace(/</g,'&lt;').replace(/>/g,'&gt;'));
      inCode = true;
    } else {
      if (inCode) { html += `<pre>${codeBuffer.join('\n')}</pre>`; codeBuffer = []; inCode = false; }
      const scramble = paraCount > 0;
      const cls = scramble ? ' class="scrambled"' : '';
      html += `<p${cls}>${obfuscatePara(para, scramble)}</p>`;
      paraCount++;
    }
  });
  if (codeBuffer.length) html += `<pre>${codeBuffer.join('\n')}</pre>`;
  return html;
}

let allPages = [];
let currentPage = 0;

function buildPages(paragraphs) {
  const fs = parseInt(localStorage.getItem('reader_fontsize') || '17');
  const lineH = fs * 1.85;
  const paraMargin = fs * 0.7;

  const topBar = 54;
  const pageHeader = 42;
  const pageFooter = 44;
  const padding = 12 + 28;
  
  const contentWidth = Math.min(window.innerWidth - 44, 680);
  const availableHeight = window.innerHeight - topBar - pageHeader - pageFooter - padding;
  
  const charWidth = fs * 0.52;
  const charsPerLine = Math.floor(contentWidth / charWidth);

  function estimateParaHeight(text) {
    if (text.startsWith('[img]')) {
      return window.innerHeight * 0.8 + (fs * 0.5);
    }
    if (text.startsWith('>') || text.startsWith('//') || 
        text.startsWith('NAME:') || text.startsWith('SYSTEM') || text.startsWith('spell ')) {
      const lines = text.split('\n').length;
      return (lines * lineH) + (fs * 0.5) + paraMargin;
    }
    if (!text.trim()) return fs * 0.5;
    const lines = Math.max(1, Math.ceil(text.length / charsPerLine));
    return (lines * lineH) + paraMargin;
  }

  const pages = [];
  let currentPageBuffer = [];
  let currentPageHeight = 0;

  paragraphs.forEach((para) => {
    const paraHeight = estimateParaHeight(para);
    const totalWithNewPara = currentPageHeight + paraHeight;
    const contentParas = currentPageBuffer.filter(p =>
      !p.startsWith('>') && !p.startsWith('//') && !p.startsWith('NAME:') &&
      !p.startsWith('SYSTEM') && !p.startsWith('spell ') && !p.startsWith('[img]'));

    const isShortContent = paraHeight < lineH * 3;
    const hasContentOnPage = contentParas.length > 0;

    if (totalWithNewPara > availableHeight && hasContentOnPage) {
      if (isShortContent && currentPageHeight + paraHeight < availableHeight * 1.15) {
        currentPageBuffer.push(para);
        currentPageHeight += paraHeight;
      } else {
        if (currentPageBuffer.length > 0) pages.push([...currentPageBuffer]);
        currentPageBuffer = [para];
        currentPageHeight = paraHeight;
      }
    } else {
      currentPageBuffer.push(para);
      currentPageHeight += paraHeight;
    }
  });

  if (currentPageBuffer.length > 0) pages.push(currentPageBuffer);
  return pages.length > 0 ? pages : [paragraphs];
}

const pageCache = new Map();

function preloadPage(pageIndex) {
  if (pageIndex < 0 || pageIndex >= allPages.length) return;
  if (pageCache.has(pageIndex)) return;
  const html = processContent(allPages[pageIndex]);
  pageCache.set(pageIndex, html);
  allPages[pageIndex].forEach(para => {
    if (para.startsWith('[img]')) {
      const url = para.slice(5).trim();
      const img = new Image();
      img.src = url;
    }
  });
}

function preloadAdjacent(pageIndex) {
  preloadPage(pageIndex + 1);
  preloadPage(pageIndex + 2);
  preloadPage(pageIndex + 3);
  preloadPage(pageIndex - 1);
}

// ── AGGRESSIVE IMAGE PRELOADING ────────────────────────────────────────
// Preload all images in chapter upfront so they're ready before user sees them
function preloadAllImages() {
  if (!chapterData || !chapterData.content) return;
  chapterData.content.forEach(para => {
    if (para.startsWith('[img]')) {
      const url = para.slice(5).trim();
      const img = new Image();
      img.src = url; // Browser caches automatically
    }
  });
}

function renderPage(pageIndex) {
  currentPage = pageIndex;
  const pageData = allPages[pageIndex];
  const entry = currentEntry;
  const d = chapterData;
  const prevEntry = entry.prev ? hashmapData[entry.prev] : null;
  const nextEntry = entry.next ? hashmapData[entry.next] : null;
  const isLastPage = pageIndex === allPages.length - 1;
  const isFirstPage = pageIndex === 0;

  const bar = document.getElementById('progress');
  if (bar) bar.style.width = allPages.length <= 1 ? '100%' : ((pageIndex / (allPages.length - 1)) * 100) + '%';

  localStorage.setItem(`pos_${hash}`, pageIndex);

  let bodyHtml = '';
  if (isFirstPage) {
    bodyHtml += `
      <div class="chapter-header">
        <div class="chapter-series" id="series-breadcrumb">Loading series...</div>
        <h1 class="chapter-title">${escHtml(d.title)}</h1>
        <div class="chapter-divider"><span>✦ ✦ ✦</span></div>
      </div>`;
  }
  const cachedBody = pageCache.get(pageIndex);
  bodyHtml += `<div class="chapter-body">${cachedBody || processContent(pageData)}</div>`;
  if (!cachedBody) pageCache.set(pageIndex, processContent(pageData));

  if (isLastPage) {
    bodyHtml += `
      <div class="chapter-nav">
        ${prevEntry
          ? `<a class="nav-chapter-btn" href="chapter.html?h=${entry.prev}">
              <div class="nav-label">◀ Previous</div>
              <div class="nav-ch-title">Ch. ${prevEntry.chapter}</div>
             </a>`
          : `<span class="nav-chapter-btn disabled"><div class="nav-label">◀ Previous</div><div class="nav-ch-title">First Chapter</div></span>`
        }
        <a class="nav-chapter-btn" href="series.html?id=${entry.series}" style="text-align:center">
          <div class="nav-label">≡</div>
          <div class="nav-ch-title">All Chapters</div>
        </a>
        ${nextEntry && (!nextEntry.locked || isUnlocked(nextEntry))
          ? `<a class="nav-chapter-btn" href="chapter.html?h=${entry.next}">
              <div class="nav-label">Next ▶</div>
              <div class="nav-ch-title">Ch. ${nextEntry.chapter}</div>
             </a>`
          : nextEntry && nextEntry.locked && !isUnlocked(nextEntry)
          ? `<span class="nav-chapter-btn locked-btn" onclick="showAdwall('${entry.next}')">
              <div class="nav-label">Next ▶</div>
              <div class="nav-ch-title">Ch. ${nextEntry.chapter} <span class="locked-tag">FREE</span></div>
             </span>`
          : `<span class="nav-chapter-btn disabled"><div class="nav-label">Next ▶</div><div class="nav-ch-title">Latest</div></span>`
        }
      </div>`;
  }

  const wrap = document.querySelector('.chapter-wrap');
  const MAX_PIPS = 20;
  const total = allPages.length;
  let pipsHtml = '';
  if (total <= MAX_PIPS) {
    pipsHtml = Array.from({length: total}, (_, i) =>
      `<span class="pip${i === pageIndex ? ' pip-active' : ''}"></span>`
    ).join('');
  } else {
    for (let i = 0; i < total; i++) {
      const near = Math.abs(i - pageIndex) <= 1 || i === 0 || i === total - 1;
      const edgeDot = (i === 1 && pageIndex > 2) || (i === total - 2 && pageIndex < total - 3);
      if (near) {
        pipsHtml += `<span class="pip${i === pageIndex ? ' pip-active' : ''}"></span>`;
      } else if (edgeDot) {
        pipsHtml += `<span class="pip pip-ellipsis"></span>`;
      }
    }
  }
  wrap.innerHTML = `
    <div class="page-header">
      <div class="page-pip-counter">${pipsHtml}</div>
      <div class="page-label">${pageIndex + 1} / ${total}</div>
    </div>
    <div class="page-view${isFirstPage ? ' page-1' : ''}">${bodyHtml}</div>
    <div class="page-footer">
      <div class="page-counter">Page <strong>${pageIndex + 1}</strong> / ${allPages.length}</div>
    </div>`;

  const pv = wrap.querySelector('.page-view');
  if (pv) {
    let tapStartX = 0, tapStartY = 0, tapStartScroll = 0, tapStartTime = 0;
    pv.addEventListener('touchstart', e => {
      tapStartX = e.touches[0].clientX;
      tapStartY = e.touches[0].clientY;
      tapStartScroll = pv.scrollTop;
      tapStartTime = Date.now();
    }, { passive: true });
    pv.addEventListener('touchend', e => {
      const dx = Math.abs(e.changedTouches[0].clientX - tapStartX);
      const dy = Math.abs(e.changedTouches[0].clientY - tapStartY);
      const scrolled = Math.abs(pv.scrollTop - tapStartScroll);
      const duration = Date.now() - tapStartTime;
      
      if (dx < 12 && dy < 12 && scrolled < 8 && duration < 250) {
        const xPct = tapStartX / window.innerWidth;
        if (xPct < 0.30 && currentPage > 0) renderPage(currentPage - 1);
        else if (xPct > 0.70 && currentPage < allPages.length - 1) renderPage(currentPage + 1);
      }
    }, { passive: true });
  }

  if (isFirstPage) {
    fetch('data/series.json').then(r=>r.json()).then(series => {
      const s = series.find(s => s.id === entry.series);
      const el = document.getElementById('series-breadcrumb');
      if (s && el) el.innerHTML = `<a href="series.html?id=${entry.series}" style="color:var(--text3);text-decoration:none">${s.title}</a>`;
    }).catch(()=>{});
  }

  setTimeout(() => preloadAdjacent(pageIndex), 100);
  applyFontSize();
}

function renderChapter() {
  const d = chapterData;
  const entry = currentEntry;
  document.title = `${d.title} — RanobeVault`;
  document.getElementById('top-title').textContent = d.title;

  allPages = buildPages(d.content || []);
  document.getElementById('content').innerHTML = `<div class="chapter-wrap"></div>`;

  setupProgress();

  const savedPage = parseInt(localStorage.getItem(`pos_${hash}`) || '0');
  renderPage((savedPage > 0 && savedPage < allPages.length) ? savedPage : 0);
}

function showAdwall(targetHash) {
  const unlockHash = targetHash || hash;
  const entry = targetHash ? hashmapData[targetHash] : currentEntry;

  if (isUnlocked(entry)) {
    window.location.href = `chapter.html?h=${unlockHash}`;
    return;
  }

  const overlay = document.getElementById('adwall');
  const link = document.getElementById('adwall-link');

  if (entry && entry.adwallUrl) {
    link.href = entry.adwallUrl;
    link.style.opacity = '1';
    link.style.pointerEvents = 'all';
  } else {
    link.href = '#';
    link.style.opacity = '0.5';
    link.style.pointerEvents = 'none';
  }

  overlay.classList.add('show');
}

function handleAdwallClick(e) {
  const link = document.getElementById('adwall-link');
  if (!link.href || link.href === '#' || link.href === window.location.href) {
    e.preventDefault(); return;
  }
}

function setupProgress() {
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      if (currentPage < allPages.length - 1) renderPage(currentPage + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      if (currentPage > 0) renderPage(currentPage - 1);
    }
  });
}

document.getElementById('settings-btn').onclick = () => {
  document.getElementById('settings-panel').classList.toggle('open');
};
document.addEventListener('click', e => {
  if (!e.target.closest('#settings-panel') && !e.target.closest('#settings-btn')) {
    document.getElementById('settings-panel').classList.remove('open');
  }
});

function applyFontSize() {
  document.documentElement.style.setProperty('--font-size', fontSize + 'px');
  const el = document.getElementById('font-val');
  if (el) el.textContent = fontSize;
}

function applyMode() {
  document.body.classList.toggle('light-mode', isLight);
  const btn = document.getElementById('mode-toggle');
  if (btn) btn.textContent = isLight ? '🌙 Dark' : '☀ Light';
}

document.getElementById('font-inc').onclick = () => {
  if (fontSize < 24) {
    fontSize++; applyFontSize(); localStorage.setItem('reader_fontsize', fontSize);
    if (chapterData) { pageCache.clear(); allPages = buildPages(chapterData.content || []); renderPage(0); }
  }
};
document.getElementById('font-dec').onclick = () => {
  if (fontSize > 13) {
    fontSize--; applyFontSize(); localStorage.setItem('reader_fontsize', fontSize);
    if (chapterData) { pageCache.clear(); allPages = buildPages(chapterData.content || []); renderPage(0); }
  }
};
document.getElementById('mode-toggle').onclick = () => { isLight = !isLight; applyMode(); localStorage.setItem('reader_light', isLight ? '1' : '0'); };

function showError(title, msg) {
  document.getElementById('content').innerHTML = `
    <div class="error-screen">
      <h2>${title}</h2>
      <p>${msg}</p>
      <br><a href="index.html" style="color:var(--accent)">← Return Home</a>
    </div>`;
}

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function updateBackLink() {
  if (currentEntry) {
    document.getElementById('back-link').href = `series.html?id=${currentEntry.series}`;
  }
}

function saveProgress() {
  if (!currentEntry || !chapterData) return;
  const data = { hash, title: chapterData.title, volume: currentEntry.volume, chapter: currentEntry.chapter };
  localStorage.setItem(`continue_${currentEntry.series}`, JSON.stringify(data));
  localStorage.setItem(`read_${hash}`, '1');
}

let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    if (chapterData && allPages.length > 0) {
      const oldPage = currentPage;
      pageCache.clear();
      allPages = buildPages(chapterData.content || []);
      const newPage = Math.min(oldPage, allPages.length - 1);
      renderPage(newPage);
    }
  }, 300);
}, { passive: true });

init();

(function() {
  let alertShowing = false;
  let longPressTimer = null;
  const LONG_PRESS_MS = 500;

  function fireAlert(reason) {
    if (window.getSelection) window.getSelection().removeAllRanges();
    if (document.selection) document.selection.empty();

    if (alertShowing) return;
    alertShowing = true;

    Swal.fire({
      customClass: { popup: 'ranobe-alert' },
      title: '✦ Content Protected ✦',
      html: `<span style="font-size:1.5rem;display:block;margin-bottom:8px">📖</span>
             This content is protected.<br>
             <span style="color:#c8a96e;font-size:0.82rem">${reason}</span>`,
      icon: 'warning',
      confirmButtonText: 'Understood',
      showClass: {
        popup: 'animate__animated animate__fadeInDown animate__faster'
      },
      hideClass: {
        popup: 'animate__animated animate__fadeOutUp animate__faster'
      },
      timer: 3500,
      timerProgressBar: true,
      allowOutsideClick: true,
      backdrop: 'rgba(10,10,16,0.7)',
      willClose: () => {
        alertShowing = false;
        if (window.getSelection) window.getSelection().removeAllRanges();
      }
    });
  }

  document.addEventListener('mouseup', function(e) {
    const sel = window.getSelection();
    if (sel && sel.toString().trim().length > 0) {
      const anchor = sel.anchorNode;
      if (anchor && document.querySelector('.chapter-body') &&
          document.querySelector('.chapter-body').contains(anchor)) {
        e.preventDefault();
        fireAlert('Please respect the author\'s work.');
      }
    }
  }, true);

  document.addEventListener('mousedown', function(e) {
    if (e.target.closest('.chapter-body') || e.target.closest('.chapter-wrap')) {
      setTimeout(() => {
        if (window.getSelection) window.getSelection().removeAllRanges();
      }, 0);
    }
  }, true);

  document.addEventListener('touchstart', function(e) {
    if (e.target.closest('.chapter-body') || e.target.closest('.chapter-wrap')) {
      longPressTimer = setTimeout(function() {
        if (window.getSelection) window.getSelection().removeAllRanges();
        fireAlert('Long press detected — content is protected.');
      }, LONG_PRESS_MS);
    }
  }, { passive: true });

  document.addEventListener('touchend', function() {
    clearTimeout(longPressTimer);
    const sel = window.getSelection();
    if (sel && sel.toString().trim().length > 0) {
      fireAlert('Text selection is disabled on this page.');
    }
  }, { passive: true });

  document.addEventListener('touchmove', function() {
    clearTimeout(longPressTimer);
  }, { passive: true });

  document.addEventListener('contextmenu', function(e) {
    if (e.target.closest('.chapter-body') || e.target.closest('.chapter-wrap') ||
        e.target.closest('.chapter-header')) {
      e.preventDefault();
      e.stopPropagation();
      fireAlert('Right-click is disabled on this page.');
      return false;
    }
  }, true);

  const BLOCKED_KEYS = new Set(['c', 'a', 'u', 's', 'p', 'x']);
  document.addEventListener('keydown', function(e) {
    const ctrl = e.ctrlKey || e.metaKey;

    if (ctrl && BLOCKED_KEYS.has(e.key.toLowerCase())) {
      e.preventDefault();
      e.stopImmediatePropagation();
      fireAlert(`Keyboard shortcut (${e.key.toUpperCase()}) is disabled.`);
      return false;
    }

    if (e.key === 'F12') {
      e.preventDefault();
      e.stopImmediatePropagation();
      fireAlert('Developer tools shortcut is disabled.');
      return false;
    }

    if (ctrl && e.shiftKey && ['i','j','c','k'].includes(e.key.toLowerCase())) {
      e.preventDefault();
      e.stopImmediatePropagation();
      fireAlert('Developer tools are restricted on this page.');
      return false;
    }

    if (ctrl && e.shiftKey && e.key.toLowerCase() === 'u') {
      e.preventDefault();
      e.stopImmediatePropagation();
      fireAlert('This action is disabled.');
      return false;
    }
  }, true);

  const PROTECTED_MESSAGE =
`--------------------------------------------------
This chapter is protected.
Please read the official version on RanobeVault:
https://ranobevault.github.io

Thank you for supporting the website.
--------------------------------------------------`;

  document.addEventListener('copy', function(e) {
    e.preventDefault();
    e.stopImmediatePropagation();
    if (e.clipboardData) {
      e.clipboardData.setData('text/plain', PROTECTED_MESSAGE);
      e.clipboardData.setData('text/html',
        `<p style="font-family:monospace;white-space:pre">${PROTECTED_MESSAGE.replace(/\n/g,'<br>')}</p>`
      );
    }
    if (window.getSelection) window.getSelection().removeAllRanges();
    fireAlert('Copying is not allowed on this page.');
    return false;
  }, true);

  document.addEventListener('cut', function(e) {
    e.preventDefault();
    e.stopImmediatePropagation();
    if (e.clipboardData) {
      e.clipboardData.setData('text/plain', PROTECTED_MESSAGE);
    }
    if (window.getSelection) window.getSelection().removeAllRanges();
    fireAlert('Cutting is not allowed on this page.');
    return false;
  }, true);

  document.addEventListener('dragstart', function(e) {
    if (e.target.closest('.chapter-body')) {
      e.preventDefault();
      return false;
    }
  }, true);

  document.addEventListener('selectstart', function(e) {
    if (e.target.closest('.chapter-body') || e.target.closest('.chapter-header')) {
      e.preventDefault();
      return false;
    }
  }, true);

  let devtoolsOpen = false;
  const threshold = 300;
  let devtoolsConfirmCount = 0;

  setInterval(function() {
    const widthDiff  = window.outerWidth  - window.innerWidth;
    const heightDiff = window.outerHeight - window.innerHeight;
    const likelyOpen = widthDiff > threshold || heightDiff > threshold;

    if (likelyOpen && !devtoolsOpen) {
      devtoolsConfirmCount++;
      if (devtoolsConfirmCount >= 3) {
        devtoolsOpen = true;
        devtoolsConfirmCount = 0;
        const body = document.querySelector('.chapter-body');
        if (body) body.style.filter = 'blur(6px)';

        if (alertShowing) return;
        alertShowing = true;
        Swal.fire({
          customClass: { popup: 'ranobe-alert' },
          title: '⚠ Just a heads-up!',
          html: `
            <span style="font-size:1.3rem;display:block;margin-bottom:10px">🛠️</span>
            <span style="color:#e8e6f0">It looks like your browser window is unusually narrow or a panel is open.</span>
            <br><br>
            <span style="color:#a09dbb;font-size:0.82rem">
              If you're just reading — no worries! This can also trigger from:<br>
              <span style="color:#c8a96e">• Browser sidebar or extensions panel</span><br>
              <span style="color:#c8a96e">• Zoomed-out display or small screen</span><br>
              <span style="color:#c8a96e">• Split-screen / windowed browsing</span><br><br>
              Simply close any side panels or go fullscreen and the content will restore.
            </span>`,
          icon: 'warning',
          confirmButtonText: '✓ Got it',
          showClass: { popup: 'animate__animated animate__fadeInDown animate__faster' },
          hideClass: { popup: 'animate__animated animate__fadeOutUp animate__faster' },
          allowOutsideClick: true,
          backdrop: 'rgba(10,10,16,0.7)',
          willClose: () => {
            alertShowing = false;
          }
        });
      }
    } else if (!likelyOpen) {
      devtoolsConfirmCount = 0;
      if (devtoolsOpen) {
        devtoolsOpen = false;
        const body = document.querySelector('.chapter-body');
        if (body) body.style.filter = '';
      }
    }
  }, 1000);

})();
</script>
